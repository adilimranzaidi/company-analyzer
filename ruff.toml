# Settings for Ruff, the linter (checks code for mistakes and untidy patterns).
# Run it with:  .venv\Scripts\ruff.exe check .
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[lint]
# E/W: style errors and warnings, F: likely bugs (unused or undefined names),
# I: import order, B: common bug patterns, UP: outdated Python idioms.
select = ["E", "W", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# The instructions and methods guide sent to Claude are written one sentence per line;
# wrapping them for the linter would change the text Claude receives.
"analyzer/assistant.py" = ["E501"]
"analyzer/synopsis.py" = ["E501"]
