# Streamlit settings for this project (no secrets here; this file is safe to commit).

[server]
# Only this computer can open the dashboard, not other devices on the network.
address = "localhost"
port = 8501
# Don't reload code files while running: a half-reloaded app can fail with "Cannot serialize
# the return value". Restart the dashboard to pick up code changes.
fileWatcherType = "none"

[browser]
# Don't send anonymous usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Hide developer menus (Deploy button etc.) for a cleaner page.
toolbarMode = "minimal"

[theme]
base = "light"
# EB Garamond: a free, faithful version of the classic Garamond typeface, from Google Fonts.
font = "EB Garamond:https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap"
headingFont = "EB Garamond:https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap"
baseFontSize = 17
primaryColor = "#1f4e79"            # deep navy for buttons, links and the selected section
backgroundColor = "#fdfcf9"         # warm off-white "paper"
secondaryBackgroundColor = "#f3f1ea" # cards and inputs
textColor = "#1d1d1b"
borderColor = "#e3e0d6"
baseRadius = "small"
showWidgetBorder = true
